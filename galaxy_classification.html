<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Visual Classification</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(120deg, #e0e7ff 0%, #f7f7f7 100%);
            margin: 0;
            padding: 0;
        }
        header {
            background: #1976d2;
            color: #fff;
            padding: 24px 0 16px 0;
            text-align: center;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            box-shadow: 0 2px 8px rgba(25,118,210,0.10);
        }
        .container {
            display: flex;
            flex-direction: row;
            max-width: 1200px;
            margin: 40px auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(25, 118, 210, 0.10);
            overflow: hidden;
        }
        .left-panel {
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 32px 32px 32px;
            background: #f5faff;
        }
        .images {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .single-band img {
            width: 720px;
            max-width: 98vw;
            border-radius: 12px;
            border: 2.5px solid #1976d2;
            margin-bottom: 24px;
            box-shadow: 0 4px 16px rgba(25,118,210,0.10);
            background: #fff;
        }
        .rgb img {
            width: 320px;
            max-width: 60vw;
            border-radius: 12px;
            border: 2.5px solid #333;
            box-shadow: 0 4px 16px rgba(51,51,51,0.10);
            background: #fff;
        }
        .right-panel {
            flex: 1;
            padding: 40px 32px 32px 32px;
            border-left: 1.5px solid #e3e8ee;
            display: flex;
            flex-direction: column;
            background: #fafdff;
        }
        .title {
            font-size: 2.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            text-align: left;
            color: #1976d2;
            letter-spacing: 1px;
        }
        .title .progress {
            font-size: 1.1rem;
            color: #555;
            margin-left: 8px;
            font-weight: normal;
        }
        .redshift-info {
            margin-bottom: 8px;
            font-size: 1.15rem;
            color: #444;
        }
        .radec-info {
            margin-bottom: 18px;
            font-size: 1.08rem;
            color: #444;
        }
        .classification {
            margin-bottom: 32px;
        }
        .classification label {
            display: block;
            margin-bottom: 16px;
            font-size: 1.15rem;
            padding: 8px 0 8px 8px;
            border-radius: 6px;
            transition: background 0.2s;
            cursor: pointer;
        }
        .classification input[type="radio"]:checked + span {
            background: #e3f0ff;
            color: #1976d2;
        }

        .flags-section {
            margin-top: 8px;
            margin-bottom: 18px;
            padding: 10px 12px;
            border-radius: 10px;
            background: #f2f6fa;
            border: 1px solid #e3e8ee;
        }
        .flags-title {
            font-weight: 700;
            color: #1976d2;
            font-size: 1.05rem;
            margin-bottom: 8px;
        }
        .flag-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0;
        }
        .flag-row label {
            min-width: 84px;
            font-size: 1rem;
            color: #333;
        }
        .flag-input {
            flex: 1;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1.5px solid #b3c6e0;
            background: #fff;
            font-size: 0.98rem;
        }

        .sub-option {
            margin: 6px 0 14px 28px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mini-btn {
            padding: 4px 10px;
            font-size: 0.95rem;
            border-radius: 6px;
            background: #42a5f5;
            color: #fff;
            border: none;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(25,118,210,0.08);
        }
        .mini-btn:active {
            transform: scale(0.98);
        }

        .choice-btn {
            padding: 6px 14px;
            font-size: 0.98rem;
            border-radius: 8px;
            border: 1.5px solid #b3c6e0;
            background: #fff;
            cursor: pointer;
            color: #333;
        }
        .choice-btn.active {
            background: #e3f0ff;
            border-color: #1976d2;
            color: #1976d2;
            font-weight: 700;
        }
        .note-label {
            margin-top: 20px;
            font-weight: bold;
            color: #1976d2;
            font-size: 1.1rem;
        }
        .saved-notes {
            margin-top: 10px;
        }
        .saved-note {
            font-size: 0.98rem;
            color: #444;
            background: #f2f6fa;
            border-radius: 6px;
            padding: 6px 10px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .delete-note-btn {
            background: #e57373;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 2px 10px;
            font-size: 0.92rem;
            margin-left: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .delete-note-btn:hover {
            background: #c62828;
        }
        textarea {
            width: 100%;
            min-height: 70px;
            border-radius: 8px;
            border: 1.5px solid #b3c6e0;
            padding: 10px;
            font-size: 1.05rem;
            margin-top: 10px;
            background: #fafdff;
            resize: vertical;
            box-shadow: 0 2px 8px rgba(25,118,210,0.04);
        }
        .nav {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
        }
        .nav button {
            padding: 12px 32px;
            font-size: 1.1rem;
            border-radius: 8px;
            border: none;
            background: linear-gradient(90deg, #1976d2 60%, #42a5f5 100%);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 2px 8px rgba(25,118,210,0.08);
        }
        .nav button:active {
            transform: scale(0.97);
        }
        .nav button:disabled {
            background: #b3c6e0;
            cursor: not-allowed;
        }
        @media (max-width: 900px) {
            .container { flex-direction: column; max-width: 98vw; }
            .left-panel, .right-panel { padding: 24px 8vw; }
            .single-band img, .rgb img { width: 90vw; }
        }
        @media (max-width: 600px) {
            .container { margin: 0; border-radius: 0; }
            .left-panel, .right-panel { padding: 16px 2vw; }
            .title { font-size: 1.2rem; }
        }
    </style>
</head>

    <header>Galaxy Visual Classification</header>
    <!-- Import Results按钮已移除 -->
    <div class="container">
        <div class="left-panel">
            <div class="images">
                <div class="single-band">
                    <img id="single-band-img" src="" alt="Single Band Image">
                </div>
    <!-- 一键清除按钮移到container外部 -->
    <button id="clear-all-btn" style="position:fixed;left:36px;bottom:36px;z-index:1000;padding:14px 32px;font-size:1.1rem;border-radius:10px;background:#e57373;color:#fff;border:none;box-shadow:0 2px 8px rgba(229,115,115,0.18);cursor:pointer;">Clear All Classifications</button>
                <div class="rgb">

                    <div style="width:100%;display:flex;justify-content:flex-end;">
                        <button id="export-result-btn" style="margin:16px 0 0 0;padding:10px 24px;font-size:1rem;border-radius:10px;background:#1976d2;color:#fff;border:none;box-shadow:0 2px 8px rgba(25,118,210,0.10);cursor:pointer;">Export Results</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="right-panel">
            <div class="title" id="galaxy-title"></div>
            <div class="redshift-info">
                Redshift (z): <span id="galaxy-redshift"></span>
            </div>
            <div class="radec-info" id="galaxy-ra-dec"></div>
            <div class="guodong-class-info" id="guodong-class-info" style="margin-bottom:18px;font-size:1.08rem;color:#d32f2f;"></div>
            <form id="classification-form">
                <div class="classification">
                    <label><input type="radio" name="class" value="Elliptical" required><span> Elliptical</span></label>
                    <div class="sub-option" id="elliptical-flag-row" style="display:none;">
                        <span style="font-size:1rem;color:#333;">flag:</span>
                        <input type="text" id="elliptical-flag-input" class="flag-input" placeholder="flag (optional)">
                    </div>
                    <label><input type="radio" name="class" value="Disk"><span> Disk</span></label>
                    <div class="sub-option" id="disk-row" style="display:none;">
                        <button type="button" class="choice-btn" data-disk-choice="bar">bar</button>
                        <button type="button" class="choice-btn" data-disk-choice="no bar">no bar</button>
                        <button type="button" class="choice-btn" data-disk-choice="other">other</button>
                    </div>
                    <div class="sub-option" id="disk-other-flag-row" style="display:none;margin-left:28px;">
                        <span style="font-size:1rem;color:#333;">flag:</span>
                        <input type="text" id="disk-other-flag-input" class="flag-input" placeholder="disk flag (optional)">
                    </div>
                    <label><input type="radio" name="class" value="Merger"><span> Merger</span></label>
                    <div class="sub-option" id="merger-flag-row" style="display:none;">
                        <span style="font-size:1rem;color:#333;">flag:</span>
                        <input type="text" id="merger-flag-input" class="flag-input" placeholder="flag (optional)">
                    </div>
                    <label><input type="radio" name="class" value="Other"><span> Other</span></label>
                    <div class="sub-option" id="other-flag-row" style="display:none;">
                        <span style="font-size:1rem;color:#333;">flag:</span>
                        <input type="text" id="other-flag-input" class="flag-input" placeholder="flag (optional)">
                    </div>
                </div>
                <div class="note-label">Note</div>
                <textarea name="note" id="note" placeholder="Add any notes about this galaxy..."></textarea>
                <button type="button" id="save-note-btn" style="margin-top:8px;margin-bottom:2px;padding:6px 18px;font-size:1rem;border-radius:6px;background:#1976d2;color:#fff;border:none;cursor:pointer;">Save</button>
                <div class="saved-notes" id="saved-notes" style="font-size:0.98rem;color:#444;background:#f2f6fa;padding:8px 12px;border-radius:6px;margin-top:10px;display:flex;align-items:center;gap:10px;"></div>
                <div class="nav">
                    <button type="button" id="prev-btn">Previous</button>
                    <button type="button" id="next-btn">Next</button>
                </div>
                <div style="margin-top:18px;display:flex;align-items:center;gap:8px;">
                    <input type="number" id="jump-input" min="1" max="428" placeholder="Go to #" style="width:70px;padding:4px 6px;border-radius:5px;border:1.2px solid #b3c6e0;font-size:1rem;">
                    <button type="button" id="jump-btn" style="padding:6px 16px;font-size:1rem;border-radius:6px;background:#42a5f5;color:#fff;border:none;cursor:pointer;">Jump</button>
                </div>
                <!-- 导出按钮已移至RGB图像右下侧 -->
            </form>
        </div>
    </div>

            const lines = text.split(/\r?\n/).filter(l => l.trim());
            // 获取表头索引
            const header = lines[0].split(',');
            const nameIdx = header.findIndex(h => h.trim().toLowerCase() === 'fscname');
            const classIdx = header.findIndex(h => h.trim().toLowerCase() === 'class');

                const cols = lines[i].split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/);
                if (cols.length <= Math.max(nameIdx, classIdx)) continue;
                const name = cols[nameIdx].replace(/"/g, '').trim();
                const cls = cols[classIdx].replace(/"/g, '').trim();
                nameToClass[name] = cls;
            }

        // 分类和笔记本地存储
        function getSavedData(idx) {
            const key = `galaxy_classification_${galaxies[idx].name}`;
            try {
                return JSON.parse(localStorage.getItem(key)) || {};
            } catch { return {}; }
        }
        function saveData(idx, data) {
            const key = `galaxy_classification_${galaxies[idx].name}`;
            localStorage.setItem(key, JSON.stringify(data));
        }

        function normalizeSavedData(raw) {
            const data = (raw && typeof raw === 'object') ? raw : {};
            return {
                class: typeof data.class === 'string' ? data.class : '',
                note: typeof data.note === 'string' ? data.note : '',
                flags: (data.flags && typeof data.flags === 'object') ? data.flags : {}
            };
        }

        function getFlagKeysForClass(selectedClass) {
            if (selectedClass === 'Disk') return ['disk_choice', 'disk_other_flag'];
            if (selectedClass === 'Elliptical') return ['elliptical_flag'];
            if (selectedClass === 'Merger') return ['merger_flag'];
            if (selectedClass === 'Other') return ['other_flag'];
            return [];
        }

        function escapeHtml(s) {
            return String(s)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        // 当前索引
        // 记住上次浏览的索引
        let current = 0;
        const total = galaxies.length;
        // 尝试从localStorage恢复上次浏览的索引
        const savedIdx = localStorage.getItem('galaxy_last_index');
        if (savedIdx !== null && !isNaN(Number(savedIdx)) && Number(savedIdx) >= 0 && Number(savedIdx) < total) {
            current = Number(savedIdx);
        }

        // DOM
        const singleImg = document.getElementById('single-band-img');
        const rgbImg = document.getElementById('rgb-img');
        const title = document.getElementById('galaxy-title');
    const redshift = document.getElementById('galaxy-redshift');
    const raDecInfo = document.getElementById('galaxy-ra-dec');
        const form = document.getElementById('classification-form');
        const note = document.getElementById('note');
        const savedNotes = document.getElementById('saved-notes');
        const ellipticalFlagRow = document.getElementById('elliptical-flag-row');
        const ellipticalFlagInput = document.getElementById('elliptical-flag-input');
        const ellipticalRadio = form.querySelector('input[type=radio][name=class][value="Elliptical"]');
        const diskRow = document.getElementById('disk-row');
        const diskOtherFlagRow = document.getElementById('disk-other-flag-row');
        const diskOtherFlagInput = document.getElementById('disk-other-flag-input');
        const diskRadio = form.querySelector('input[type=radio][name=class][value="Disk"]');
        const mergerFlagRow = document.getElementById('merger-flag-row');
        const mergerFlagInput = document.getElementById('merger-flag-input');
        const mergerRadio = form.querySelector('input[type=radio][name=class][value="Merger"]');
        const otherFlagRow = document.getElementById('other-flag-row');
        const otherFlagInput = document.getElementById('other-flag-input');
        const otherRadio = form.querySelector('input[type=radio][name=class][value="Other"]');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');
        const jumpBtn = document.getElementById('jump-btn');
        // 分类radio
        const radios = form.querySelectorAll('input[type=radio][name=class]');

        function getSelectedClassValue() {
            const selected = Array.from(radios).find(r => r.checked);
            return selected ? selected.value : '';
        }

        function getFlagsFromUI(selectedClass) {
            const flags = {};
            if (selectedClass === 'Elliptical') {
                flags.elliptical_flag = ellipticalFlagInput ? ellipticalFlagInput.value : '';
                return flags;
            }
            if (selectedClass === 'Disk') {
                const active = diskRow ? diskRow.querySelector('button[data-disk-choice].active') : null;
                flags.disk_choice = active ? active.getAttribute('data-disk-choice') : '';
                flags.disk_other_flag = diskOtherFlagInput ? diskOtherFlagInput.value : '';
                return flags;
            }
            if (selectedClass === 'Merger') {
                flags.merger_flag = mergerFlagInput ? mergerFlagInput.value : '';
                return flags;
            }
            if (selectedClass === 'Other') {
                flags.other_flag = otherFlagInput ? otherFlagInput.value : '';
                return flags;
            }
            return flags;
        }

        function saveCurrentState(overrides = {}) {
            const selectedClass = getSelectedClassValue();
            const rawSaved = normalizeSavedData(getSavedData(current));
            const base = {
                class: selectedClass,
                note: note.value,
                flags: getFlagsFromUI(selectedClass)
            };
            const merged = {
                ...base,
                ...overrides,
                flags: { ...base.flags, ...(overrides.flags || {}) }
            };
            saveData(current, merged);
        }

        function flagsToSummary(flags) {
            if (!flags || typeof flags !== 'object') return '';
            const entries = Object.entries(flags)
                .map(([k, v]) => [k, (v ?? '').toString().trim()])
                .filter(([, v]) => v.length > 0);
            if (entries.length === 0) return '';
            const friendly = entries.map(([k, v]) => {
                if (k === 'disk_choice') return `disk: ${v}`;
                if (k === 'disk_other_flag') return `disk flag: ${v}`;
                return `${k.replaceAll('_flag', '')}: ${v}`;
            });
            return friendly.join(' | ');
        }

        function updateInlineFlagVisibility(selectedClass, savedFlags) {
            if (diskRow) diskRow.style.display = (selectedClass === 'Disk') ? 'flex' : 'none';
            if (mergerFlagRow) mergerFlagRow.style.display = (selectedClass === 'Merger') ? 'flex' : 'none';
            if (otherFlagRow) otherFlagRow.style.display = (selectedClass === 'Other') ? 'flex' : 'none';

            const flags = (savedFlags && typeof savedFlags === 'object') ? savedFlags : {};
            const diskChoice = typeof flags.disk_choice === 'string' ? flags.disk_choice : '';
            if (diskOtherFlagRow) {
                diskOtherFlagRow.style.display = (selectedClass === 'Disk' && diskChoice === 'other') ? 'flex' : 'none';
            }
        }

        function setDiskChoice(choice) {
            if (!diskRow) return;
            const buttons = diskRow.querySelectorAll('button[data-disk-choice]');
            buttons.forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-disk-choice') === choice));
        }

        function show(idx) {
            const g = galaxies[idx];
            singleImg.src = `Images/Single_band/${g.name}_grz.png`;
            rgbImg.src = `Images/RGB/${g.name}_riz.png`;
            // Show name and progress inline
            title.innerHTML = `${g.name} <span style='font-size:1.1rem;color:#555;font-weight:normal;margin-left:8px;'>(${idx + 1} / ${total})</span>`;
            redshift.textContent = g.z;
            // 展示ra, dec，保留6位小数
            if (g.ra !== undefined && g.dec !== undefined) {
                raDecInfo.innerHTML = `RA: <span style='color:#1976d2;'>${g.ra.toFixed(6)}</span> &nbsp; DEC: <span style='color:#1976d2;'>${g.dec.toFixed(6)}</span>`;
            } else {
                raDecInfo.innerHTML = '';
            }
            // 展示Guodong--class（直接读取galaxies数组中的class字段）
            const classText = g.class ? `Guodong--${g.class}` : '';
            document.getElementById('guodong-class-info').innerText = classText;
            // 恢复分类和笔记
            const saved = normalizeSavedData(getSavedData(idx));
            radios.forEach(r => r.checked = (saved.class === r.value));
            note.value = saved.note || '';

            // Elliptical flag 行
            if (ellipticalFlagInput) {
                ellipticalFlagInput.value = (saved.flags && typeof saved.flags.elliptical_flag === 'string') ? saved.flags.elliptical_flag : '';
            }
            updateEllipticalFlagRowVisibility();

            // Disk/Merger/Other inline flags
            if (diskOtherFlagInput) {
                diskOtherFlagInput.value = (saved.flags && typeof saved.flags.disk_other_flag === 'string') ? saved.flags.disk_other_flag : '';
            }
            if (mergerFlagInput) {
                mergerFlagInput.value = (saved.flags && typeof saved.flags.merger_flag === 'string') ? saved.flags.merger_flag : '';
            }
            if (otherFlagInput) {
                otherFlagInput.value = (saved.flags && typeof saved.flags.other_flag === 'string') ? saved.flags.other_flag : '';
            }
            setDiskChoice((saved.flags && typeof saved.flags.disk_choice === 'string') ? saved.flags.disk_choice : '');
            updateInlineFlagVisibility(saved.class, saved.flags);

            // 仅显示备注和删除按钮（不在此处显示Flags）
            if (saved.note) {
                savedNotes.innerHTML = `<span style='font-size:0.95rem;'><b>Note</b>: ${escapeHtml(saved.note)}</span> <button id='delete-note-btn' style='font-size:0.95rem;padding:2px 10px;border-radius:5px;background:#e57373;color:#fff;border:none;cursor:pointer;'>删除Note</button>`;
            } else {
                savedNotes.innerHTML = '';
            }
            // 保存当前索引到localStorage
            localStorage.setItem('galaxy_last_index', idx);
        }

        function updateEllipticalFlagRowVisibility() {
            if (!ellipticalFlagRow || !ellipticalRadio) return;
            ellipticalFlagRow.style.display = ellipticalRadio.checked ? 'flex' : 'none';
        }

        // 保存按钮
        document.getElementById('save-note-btn').onclick = function() {
            const selected = Array.from(radios).find(r => r.checked);
            if (!selected) { alert('请选择分类'); return; }
            saveCurrentState();
            // 立即刷新显示
            show(current);
        };

        // 分类变更：保存并刷新flags区（不再自动跳转到下一张）
        radios.forEach(radio => {
            radio.addEventListener('change', function() {
                const selectedClass = getSelectedClassValue();
                const saved = normalizeSavedData(getSavedData(current));
                updateEllipticalFlagRowVisibility();
                saveData(current, { ...saved, class: selectedClass });
                show(current);
            });
        });

        // 有些浏览器/场景下 click 比 change 更及时，确保 Elliptical 子行立即出现
        if (ellipticalRadio) {
            ellipticalRadio.addEventListener('click', updateEllipticalFlagRowVisibility);
        }

        // Disk buttons: click to toggle + auto-save
        if (diskRow) {
            diskRow.addEventListener('click', function(e) {
                const target = e.target;
                if (!target || !target.matches || !target.matches('button[data-disk-choice]')) return;
                if (getSelectedClassValue() !== 'Disk') return;
                const choice = target.getAttribute('data-disk-choice') || '';
                setDiskChoice(choice);
                if (diskOtherFlagRow) {
                    diskOtherFlagRow.style.display = (choice === 'other') ? 'flex' : 'none';
                }
                if (choice !== 'other' && diskOtherFlagInput) {
                    diskOtherFlagInput.value = '';
                }
                saveCurrentState({ flags: { disk_choice: choice, disk_other_flag: (choice === 'other' && diskOtherFlagInput) ? diskOtherFlagInput.value : '' } });
            });
        }

        // Disk other flag input: auto-save
        if (diskOtherFlagInput) {
            diskOtherFlagInput.addEventListener('input', function() {
                if (getSelectedClassValue() === 'Disk') {
                    saveCurrentState();
                }
            });
        }

        // Merger/Other flag inputs: auto-save
        if (mergerFlagInput) {
            mergerFlagInput.addEventListener('input', function() {
                if (getSelectedClassValue() === 'Merger') {
                    saveCurrentState();
                }
            });
        }
        if (otherFlagInput) {
            otherFlagInput.addEventListener('input', function() {
                if (getSelectedClassValue() === 'Other') {
                    saveCurrentState();
                }
            });
        }

        // Elliptical flag 输入：实时保存
        if (ellipticalFlagInput) {
            ellipticalFlagInput.addEventListener('input', function() {
                if (getSelectedClassValue() === 'Elliptical') {
                    saveCurrentState();
                }
            });
        }

        // 上一/下一
        prevBtn.onclick = function() {
            if (current > 0) { current--; show(current); }
        };
        nextBtn.onclick = function() {
            if (current < total - 1) { current++; show(current); }
        };

        // 跳转
        jumpBtn.onclick = function() {
            const idx = parseInt(jumpInput.value, 10) - 1;
            if (idx >= 0 && idx < total) {
                current = idx; show(current);
            } else {
                alert('编号超出范围');
            }
        };

        // 回车跳转
        jumpInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') jumpBtn.onclick();
        });
    // 初始化
    show(current);
    // 一键清除所有分类和备注
    document.getElementById('clear-all-btn').onclick = function() {
        if (!confirm('确定要清除所有分类和备注吗？此操作不可恢复！')) return;
        for (let i = 0; i < galaxies.length; i++) {
            localStorage.removeItem(`galaxy_classification_${galaxies[i].name}`);
        }
        localStorage.removeItem('galaxy_last_index');
        alert('所有分类和备注已清除！');
        location.reload();
    };
    // 删除备注按钮事件（事件委托）
    document.getElementById('saved-notes').addEventListener('click', function(e) {
        if (e.target && e.target.id === 'delete-note-btn') {
            const saved = normalizeSavedData(getSavedData(current));
            saveData(current, { class: saved.class, note: '', flags: saved.flags });
            show(current);
        }
    });
        document.getElementById('export-result-btn').onclick = function() {
            let csv = 'name,class,elliptical_flag,disk_bar_flag,disk_no_bar_flag,disk_other_flag,merger_flag,other_flag,note\n';
            for (let i = 0; i < galaxies.length; i++) {
                const g = galaxies[i];
                const saved = normalizeSavedData(getSavedData(i));
                const c = saved.class ? saved.class.replace(/"/g, '""') : '';
                const f = saved.flags || {};
                const ef = typeof f.elliptical_flag === 'string' ? f.elliptical_flag.replace(/"/g, '""') : '';
                const diskChoice = typeof f.disk_choice === 'string' ? f.disk_choice : '';
                const db = diskChoice === 'bar' ? '1' : '';
                const dnb = diskChoice === 'no bar' ? '1' : '';
                const dof = diskChoice === 'other' && typeof f.disk_other_flag === 'string' ? f.disk_other_flag.replace(/"/g, '""') : '';
                const mf = typeof f.merger_flag === 'string' ? f.merger_flag.replace(/"/g, '""') : '';
                const of = typeof f.other_flag === 'string' ? f.other_flag.replace(/"/g, '""') : '';
                const n = saved.note ? saved.note.replace(/"/g, '""') : '';
                csv += `"${g.name}","${c}","${ef}","${db}","${dnb}","${dof}","${mf}","${of}","${n}"\n`;
            }
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'galaxy_classification_results.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };
        // Import Results相关JS已移除
    </script>
